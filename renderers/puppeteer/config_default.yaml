# 如需自定义，复制此文件为 config.yaml 进行配置
# 更新配置后需要重启

# chromium 地址，可填写系统的edge/chromium路径，例如（根据实际情况调整）：
# chromiumPath: C:\Program Files (x86)\Microsoft\Edge\Application\msedge.exe
chromiumPath:

# puppeteer websocket 地址。连接单独存在的 chromium。
# puppeteerWS: 'ws://browserless:3000'
puppeteerWS:

# headless
headless: "new"

# puppeteer启动args，注意args的--前缀
args:
  - --disable-gpu
  - --disable-setuid-sandbox
  - --no-sandbox
  - --no-zygote

# puppeteer截图超时时间
puppeteerTimeout:

# 空闲多久(毫秒)后自动关闭浏览器释放资源，下次渲染按需重启。0 为不关闭。默认 1800000(30分钟)
idleTimeout: 1800000

# 关闭浏览器的超时时间(毫秒)，超时则按 PID 强制结束进程树，避免孤儿/僵尸进程。默认 8000
closeTimeout: 8000

# 累计截图多少次后自动重启浏览器，避免渲染越来越慢。默认 100
restartNum: 100

# 页面goto时的参数
pageGotoParams:
  timeout: 120000

# 用户数据目录
userDataDir: data/puppeteer
